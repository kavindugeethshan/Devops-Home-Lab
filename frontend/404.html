<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Page Not Found | G LAB</title>
    <link rel="icon" type="image/png" href="animation/Favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="preloader.js"></script>
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --card-border: #e2e8f0;
            --card-border-hover: #cbd5e1;
            --primary-blue: #2563eb;
            --primary-blue-hover: #1d4ed8;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --accent-gradient: linear-gradient(135deg, #0284c7 0%, #2563eb 100%);
            --accent-glow: rgba(37, 99, 235, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow-x: hidden;
        }

        /* HEADER */
        header {
            background-color: #ffffff;
            border-bottom: 1px solid var(--card-border);
            padding: 16px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
        }

        .logo-title {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            text-decoration: none;
        }

        .logo-icon {
            width: 42px;
            height: 42px;
            background: var(--accent-gradient);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Outfit', sans-serif;
            font-weight: 800;
            font-size: 1.3rem;
            color: white;
            box-shadow: 0 4px 15px var(--accent-glow);
        }

        .logo-text h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 1.45rem;
            font-weight: 800;
            color: #0f172a;
            letter-spacing: -0.5px;
            line-height: 1.1;
        }

        .logo-text span {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 11px 22px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 0.92rem;
            cursor: pointer;
            transition: all 0.25s ease;
            text-decoration: none;
            border: none;
            font-family: inherit;
        }

        .btn-primary {
            background: var(--primary-blue);
            color: #ffffff;
            box-shadow: 0 4px 16px rgba(37, 99, 235, 0.25);
        }

        .btn-primary:hover {
            background: var(--primary-blue-hover);
            transform: translateY(-2px);
            box-shadow: 0 8px 22px rgba(37, 99, 235, 0.35);
        }

        .btn-outline {
            background: #ffffff;
            color: var(--text-main);
            border: 1.5px solid var(--card-border);
        }

        .btn-outline:hover {
            border-color: var(--primary-blue);
            color: var(--primary-blue);
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(15, 23, 42, 0.05);
        }

        /* 404 HERO CONTAINER */
        .error-page-container {
            max-width: 860px;
            margin: 40px auto;
            padding: 0 24px;
            text-align: center;
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .error-card {
            background: #ffffff;
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 48px 36px;
            box-shadow: 0 12px 40px rgba(15, 23, 42, 0.05);
            animation: fadeInUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(24px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* CAVEMAN ANIMATION VIDEO CONTAINER */
        .caveman-video-wrapper {
            position: relative;
            width: 100%;
            max-width: 440px;
            height: 280px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .caveman-video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 6px 15px rgba(0, 0, 0, 0.08));
        }

        .error-code {
            font-family: 'Outfit', sans-serif;
            font-size: 4.8rem;
            font-weight: 800;
            line-height: 1;
            background: linear-gradient(135deg, #0284c7 0%, #2563eb 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 12px;
            letter-spacing: -2px;
        }

        .error-title {
            font-family: 'Outfit', sans-serif;
            font-size: 1.85rem;
            font-weight: 800;
            color: var(--text-main);
            margin-bottom: 10px;
            letter-spacing: -0.5px;
        }

        .error-description {
            font-size: 1rem;
            color: var(--text-muted);
            max-width: 480px;
            line-height: 1.6;
            margin-bottom: 32px;
        }

        .error-actions {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
            max-width: 520px;
        }

        /* FOOTER */
        .site-footer {
            background: #ffffff;
            border-top: 1px solid var(--card-border);
            padding: 24px 40px;
            margin-top: 40px;
        }

        .footer-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            font-size: 0.88rem;
            color: var(--text-muted);
        }

        .footer-content strong {
            color: var(--text-main);
        }

        /* RESPONSIVE BREAKPOINTS */
        @media (max-width: 640px) {
            header {
                padding: 14px 20px;
            }

            .error-card {
                padding: 32px 20px;
            }

            .caveman-video-wrapper {
                height: 190px;
            }

            .error-code {
                font-size: 3.8rem;
            }

            .error-title {
                font-size: 1.45rem;
            }

            .error-actions {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <!-- HEADER -->
    <header>
        <a href="home.html" class="logo-title">
            <div class="logo-icon">G</div>
            <div class="logo-text">
                <h1>G LAB</h1>
                <span>COMPUTER HARDWARE</span>
            </div>
        </a>

        <div class="nav-actions">
            <a href="home.html" class="btn btn-outline">
                <i class="fa-solid fa-house"></i> Home Page
            </a>
            <a href="products.html" class="btn btn-primary">
                <i class="fa-solid fa-store"></i> All Products
            </a>
        </div>
    </header>

    <!-- 404 ERROR CONTENT -->
    <div class="error-page-container">
        <div class="error-card">
            <!-- 404 Animation Video -->
            <div class="caveman-video-wrapper">
                <video id="cavemanVideo" autoplay loop muted playsinline preload="auto" class="caveman-video">
                    <source src="animation/error-404.webm" type="video/webm">
                    <source src="animation/Error%20404.webm" type="video/webm">
                    <source src="animation/caveman-404.webm" type="video/webm">
                    Your browser does not support webm video playback.
                </video>
            </div>

            <!-- Error Text -->
            <h2 class="error-title">Oops! This page doesn't exist.</h2>
            <p class="error-description">
                The page you're looking for may have been moved, renamed, or doesn't exist in our store catalog.
            </p>

            <!-- Action Buttons -->
            <div class="error-actions">
                <a href="home.html" class="btn btn-primary">
                    <i class="fa-solid fa-house"></i> Go Home
                </a>
                <button onclick="history.back()" class="btn btn-outline">
                    <i class="fa-solid fa-arrow-left"></i> Go Back
                </button>
                <a href="products.html" class="btn btn-outline">
                    <i class="fa-solid fa-cart-shopping"></i> Browse Products
                </a>
            </div>
        </div>
    </div>

    <!-- FOOTER -->
    <footer class="site-footer">
        <div class="footer-content">
            <div>
                © 2026 <strong>G LAB</strong>. All rights reserved. Sri Lanka's Hardware Store.
            </div>
            <div>
                Developed by <strong>Kavindu Geethshan</strong>
            </div>
        </div>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const vid = document.getElementById("cavemanVideo");
            if (vid) {
                vid.play().catch(function (err) {
                    console.log("Video autoplay handled:", err);
                });
            }
        });
    </script>
</body>

</html>
