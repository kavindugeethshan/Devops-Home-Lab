name: Docker Build and Push

on:
  workflow_dispatch:

jobs:
  docker:
    name: Build, Push and Deploy
    runs-on: self-hosted

    permissions:
      contents: read
      packages: write

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Check project files
        run: |
          pwd
          ls -la
          ls -la frontend

      - name: Build backend Docker image
        working-directory: ${{ github.workspace }}
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/g-lab-backend:latest \
            .

      - name: Push backend Docker image
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/g-lab-backend:latest

      - name: Deploy backend container
        run: |
          docker stop g-lab-backend || true
          docker rm g-lab-backend || true

          docker run -d \
            --name g-lab-backend \
            -p 3001:3001 \
            --env-file /home/prabavi/.env \
            ghcr.io/${{ github.repository_owner }}/g-lab-backend:latest

      - name: Build frontend Docker image
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/g-lab-frontend:latest \
            ./frontend

      - name: Push frontend Docker image
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/g-lab-frontend:latest

      - name: Deploy frontend container
        run: |
          docker stop g-lab-frontend || true
          docker rm g-lab-frontend || true

          docker run -d \
            --name g-lab-frontend \
            -p 8080:80 \
            ghcr.io/${{ github.repository_owner }}/g-lab-frontend:latest