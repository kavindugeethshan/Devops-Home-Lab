name: Docker Build and Push

on:
  push:
    branches:
      - main

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build backend image
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/g-lab-backend:latest \
            .

      - name: Push backend image
        run: |
          docker push \
            ghcr.io/${{ github.repository_owner }}/g-lab-backend:latest

      - name: Build frontend image
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/g-lab-frontend:latest \
            ./frontend

      - name: Push frontend image
        run: |
          docker push \
            ghcr.io/${{ github.repository_owner }}/g-lab-frontend:latest